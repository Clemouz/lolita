<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Lola</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #fceabb 0%, #f8b195 50%, #f67280 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow-x: hidden;
}
.container {
  background: rgba(255,255,255,0.9);
  border-radius: 20px;
  padding: 40px;
  max-width: 600px;
  width: 100%;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
  position: relative;
}
h1 { color: #d64550; margin-bottom: 10px; }
.intro { color: #555; margin-bottom: 30px; font-style: italic; }
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 20px;
}
.card {
  aspect-ratio: 1;
  background: #f67280;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: white;
  cursor: pointer;
  transition: transform 0.4s, background 0.4s;
  user-select: none;
}
.card.revealed {
  background: #ffe0d6;
  color: #333;
  font-size: 0.95rem;
  padding: 10px;
  cursor: default;
  transform: rotateY(360deg);
}
.card:not(.revealed):hover { transform: scale(1.05) rotate(-2deg); }
.final {
  margin-top: 20px;
  padding: 25px;
  background: #fff5f0;
  border-radius: 16px;
  border: 2px dashed #f67280;
  position: relative;
  min-height: 160px;
}
.final h2 { color: #d64550; }
.hidden { display: none; }
.btn-row {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 15px;
  position: relative;
  height: 60px;
}
button {
  padding: 12px 28px;
  font-size: 1rem;
  border: none;
  border-radius: 30px;
  cursor: pointer;
  transition: background 0.3s, transform 0.15s;
}
#yesBtn {
  background: #d64550;
  color: white;
}
#yesBtn:hover { background: #b8323c; transform: scale(1.05); }
#noBtn {
  background: #ddd;
  color: #555;
  position: absolute;
  transition: left 0.2s, top 0.2s, transform 0.2s;
}
#noBtn:hover { background: #ccc; }
.success-msg {
  color: #2e7d32;
  font-weight: bold;
  margin-top: 15px;
}
.oups-msg {
  color: #b8323c;
  font-weight: bold;
  margin-top: 15px;
}
</style>
</head>
<body>
<div class="container">
  <h1>Hey Lola</h1>
  <p class="intro">Je t'ai bricolé un petit truc. Clique sur les cases, une par une, tu vas comprendre.</p>

  <div class="grid" id="grid"></div>

  <div id="final" class="final hidden">
    <h2>Bon. Tu es invitée dans le Sud, ce weekend.</h2>
    <p>Alors, tu viens ou pas ?</p>
    <div class="btn-row" id="btnRow">
      <button id="yesBtn">Ouais, carrément</button>
      <button id="noBtn">Bof, non</button>
    </div>
    <p id="resultMsg"></p>
  </div>
</div>

<script>
const messages = [
  "Bon, je vais pas tourner autour du pot cent ans.",
  "J'aime bien passer du temps avec toi, tu l'auras remarqué.",
  "Et j'ai une idée pour ce weekend.",
  "Ça se passe dans le Sud, avec du soleil et tout.",
  "Et moi aussi, accessoirement.",
  "Dernière case, courage."
];

const grid = document.getElementById('grid');
const final = document.getElementById('final');
let revealedCount = 0;

messages.forEach((msg, i) => {
  const card = document.createElement('div');
  card.classList.add('card');
  card.textContent = i + 1;
  card.addEventListener('click', () => {
    if (card.classList.contains('revealed')) return;
    card.classList.add('revealed');
    card.textContent = msg;
    revealedCount++;
    if (revealedCount === messages.length) {
      setTimeout(() => {
        final.classList.remove('hidden');
        final.scrollIntoView({ behavior: 'smooth' });
      }, 500);
    }
  });
  grid.appendChild(card);
});

const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const btnRow = document.getElementById('btnRow');
const resultMsg = document.getElementById('resultMsg');
let dodgeCount = 0;

function moveNoBtn() {
  const rowRect = btnRow.getBoundingClientRect();
  const btnW = noBtn.offsetWidth;
  const btnH = noBtn.offsetHeight;
  const maxX = rowRect.width - btnW;
  const maxY = 100;
  const newX = Math.max(0, Math.random() * maxX);
  const newY = Math.max(0, Math.random() * maxY) - 20;
  noBtn.style.left = newX + 'px';
  noBtn.style.top = newY + 'px';
}

noBtn.addEventListener('mouseenter', () => {
  dodgeCount++;
  if (dodgeCount < 5) {
    moveNoBtn();
  } else {
    noBtn.style.transition = 'opacity 0.4s, transform 0.4s';
    noBtn.style.opacity = '0';
    noBtn.style.transform = 'scale(0)';
    setTimeout(() => {
      noBtn.style.display = 'none';
      resultMsg.className = 'oups-msg';
      resultMsg.textContent = 'Oups, il a disparu. Il ne reste plus qu\'une option, en fait.';
    }, 400);
  }
});

noBtn.addEventListener('click', (e) => {
  e.preventDefault();
  moveNoBtn();
});

function launchFireworks() {
  const duration = 2500;
  const end = Date.now() + duration;
  (function frame() {
    confetti({
      particleCount: 4,
      angle: 60,
      spread: 55,
      origin: { x: 0 },
      colors: ['#d64550', '#f67280', '#ffd166', '#06d6a0']
    });
    confetti({
      particleCount: 4,
      angle: 120,
      spread: 55,
      origin: { x: 1 },
      colors: ['#d64550', '#f67280', '#ffd166', '#06d6a0']
    });
    if (Date.now() < end) requestAnimationFrame(frame);
  })();
  confetti({
    particleCount: 150,
    spread: 100,
    origin: { y: 0.5 }
  });
}

yesBtn.addEventListener('click', () => {
  yesBtn.disabled = true;
  noBtn.style.display = 'none';
  resultMsg.className = 'success-msg';
  resultMsg.textContent = "Nickel, c'est noté. On se voit ce weekend.";
  launchFireworks();
});
</script>
</body>
</html>
